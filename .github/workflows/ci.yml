name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Linter catches the Claude baseline (expected to score under 60)
        run: "! python -m engine lint examples/northwind-synthetic/claude_baseline.md --min-score 60"
